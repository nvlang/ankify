[package]
name = "ankify"
version = "0.1.0"
edition = "2021"
description = "Generate and sync Anki flashcards from your Typst documents."
authors = ["N. V. Lang <@nvlang>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/nvlang/ankify"
keywords = ["anki", "typst", "flashcards", "spaced-repetition"]
categories = ["command-line-utilities", "text-processing"]


[dependencies]
# Async runtime
tokio = { workspace = true }

# CLI and configuration
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for AnkiConnect
reqwest = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Hashing
sha2 = { workspace = true }

# Date and time handling
chrono = { workspace = true }

# Async combinators
futures = { workspace = true }

# Path handling
pathdiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
regex = "1.10"

[[bin]]
name = "ankify"
path = "src/main.rs"

[lib]
name = "ankify"
path = "src/lib.rs"
