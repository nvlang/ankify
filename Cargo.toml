[workspace]
members = ["packages/ankify-cli"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for AnkiConnect
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system operations
glob = "0.3"
walkdir = "2.5"
notify = "8.0"
tempfile = "3.20"

# Hashing and caching
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.17", features = ["v4"] }

# Base64 encoding for images
base64 = "0.22"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Typst for content parsing and serialization
typst = "0.13"
typst-eval = "0.13"
typst-html = "0.13"
typst-kit = "0.13"
typst-macros = "0.13"
typst-pdf = "0.13"
typst-render = "0.13"
typst-svg = "0.13"
typst-timing = "0.13"

# File watching
futures = "0.3"

# Path handling
pathdiff = "0.2"

# Testing utilities
tokio-test = "0.4"
mockito = "1.7"
wiremock = "0.6"
proptest = "1.6"
rand = "0.9"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
