[package]
name = "ankify"
version = "2.0.0"
edition = "2021"
description = "Advanced Typst to Anki bridge with caching, templating, and watch mode support"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nvlang/ankify"
keywords = ["anki", "typst", "flashcards", "spaced-repetition"]
categories = ["command-line-utilities", "text-processing"]


[dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for AnkiConnect
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system operations
glob = "0.3"
walkdir = "2.5"
notify = "8.0"
tempfile = "3.20"

# Hashing and caching
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.17", features = ["v4"] }

# Base64 encoding for images
base64 = "0.22"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# File watching
futures = "0.3"

# Path handling
pathdiff = "0.2"

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
mockito = "1.7"
tempfile = "3.20"
wiremock = "0.6"
proptest = "1.6"
rand = "0.9"
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true

[[bin]]
name = "ankify"
path = "src/main.rs"

[lib]
name = "ankify"
path = "src/lib.rs"
