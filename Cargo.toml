[workspace]
members = ["packages/ankify-cli"]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.45", features = ["full"] }

# CLI and configuration
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for AnkiConnect
reqwest = { version = "0.12", features = ["json"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
sha2 = "0.10"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Async combinators
futures = "0.3"

# Path handling
pathdiff = "0.2"

# Testing utilities
tempfile = "3.20"
wiremock = "=0.6.3" # 0.6.5+ needs Rust 1.88 (let-chains); pinned for MSRV

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
