name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The integration tests shell out to the `typst` binary.
      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      # The release profile sets panic = "abort" and LTO; build it once so a
      # release-only breakage is caught before publishing.
      - name: Release build
        run: cargo build --release --workspace

  typst-check:
    name: Typst package check
    runs-on: ubuntu-latest
    steps:
      - name: Check out ankify
        uses: actions/checkout@v4
        with:
          path: ankify

      # `package-check` resolves a package's `@preview` imports from a local
      # clone of the registry, not from the network. `ankify` depends only on
      # `valkyrie`; if it ever gains another `@preview` dependency, add it to
      # the `sparse-checkout` list below.
      - name: Check out the Typst package registry
        uses: actions/checkout@v4
        with:
          repository: typst/packages
          path: typst-packages
          sparse-checkout: packages/preview/valkyrie

      - name: Validate Typst package
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' ankify/packages/ankify-typst/typst.toml)"
          echo "Checking ankify ${version}"
          dest="typst-packages/packages/preview/ankify/${version}"
          mkdir -p "${dest}"
          cp -r ankify/packages/ankify-typst/. "${dest}"
          # `package-check` resolves `@preview/<name>:<ver>` to
          # `$PACKAGES_DIR/packages/preview/<name>/<ver>` (with `$GITHUB_WORKSPACE`
          # then `..` as fallbacks). Point it at the mounted clone root.
          docker run --rm \
            -e PACKAGES_DIR=/data \
            -v "${{ github.workspace }}/typst-packages:/data" \
            ghcr.io/typst/package-check:0.4.5 \
            check "@preview/ankify:${version}"
